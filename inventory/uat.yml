# Inventory Production environment
all:
  vars:
    ansible_connection: aws_ssm
    ansible_aws_ssm_region: ap-southeast-1
    ansible_aws_ssm_bucket_name: "ansible-ssm-sts"

  children:
    monitoring_server:
      hosts:
        monitor-ec2-cicd:
          ansible_aws_ssm_instance_id: i-07f529f2770a5bfa5

    target_servers:
      hosts:
        target-ec2-ecom-sandbox:
          ansible_aws_ssm_instance_id: i-03a7cd36465405052
          private_ip: "10.0.3.130"
          install_phpfpm_exporter: true
