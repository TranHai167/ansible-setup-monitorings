---
- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Fail if Docker is not installed
  fail:
    msg: "Docker is not installed on this host. Please install Docker first."
  when: docker_check.rc != 0

- name: Stop existing cAdvisor container (if any)
  docker_container:
    name: cadvisor
    state: absent
  ignore_errors: true

- name: Check cgroup version
  command: stat -f -c %T /sys/fs/cgroup
  register: cgroup_fstype
  changed_when: false

- name: Set cgroup mount path
  set_fact:
    cgroup_mount: "{{ '/sys/fs/cgroup:/sys/fs/cgroup:ro' if cgroup_fstype.stdout == 'cgroup2fs' else '/sys/fs/cgroup:/cgroup:ro' }}"

- name: Check if containerd socket exists
  stat:
    path: /run/containerd/containerd.sock
  register: containerd_sock

- name: Build cAdvisor volume list
  set_fact:
    cadvisor_volumes: >-
      {{
        [
          '/:/rootfs:ro',
          '/var/run:/var/run:rw',
          '/var/run/docker.sock:/var/run/docker.sock:ro',
          '/sys:/sys:ro',
          cgroup_mount,
          '/var/lib/docker/:/var/lib/docker:ro',
          '/dev/disk/:/dev/disk:ro'
        ]
        + (['/run/containerd/containerd.sock:/run/containerd/containerd.sock:ro'] if containerd_sock.stat.exists else [])
      }}

- name: Run cAdvisor container
  docker_container:
    name: cadvisor
    image: "gcr.io/cadvisor/cadvisor:{{ cadvisor_version }}"
    state: started
    restart_policy: always
    ports:
      - "{{ cadvisor_port }}:8080"
    volumes: "{{ cadvisor_volumes }}"
    command: "{{ cadvisor_extra_args | default(omit) }}"
    privileged: true
    cgroupns_mode: host
