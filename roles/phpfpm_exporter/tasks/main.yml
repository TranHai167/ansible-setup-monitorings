---
- name: Set architecture variable
  set_fact:
    phpfpm_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check if php-fpm is running
  shell: 'pgrep -x php-fpm || pgrep -f "php-fpm: master"'
  register: phpfpm_check
  ignore_errors: true
  changed_when: false

- name: Warn if php-fpm is not running
  debug:
    msg: "WARNING: php-fpm is not running on this host. Exporter will be installed but won't collect metrics until php-fpm starts."
  when: phpfpm_check.rc != 0

- name: Enable php-fpm status page
  lineinfile:
    path: "{{ phpfpm_pool_config }}"
    regexp: '^;?pm\.status_path\s*='
    line: 'pm.status_path = /status'
    backup: true
  notify: restart php-fpm
  ignore_errors: true

- name: Flush handlers to restart php-fpm before starting exporter
  meta: flush_handlers

- name: Check if php-fpm_exporter is installed
  stat:
    path: /usr/local/bin/php-fpm_exporter
  register: phpfpm_exporter_bin

- name: Download php-fpm_exporter
  get_url:
    url: "https://github.com/hipages/php-fpm_exporter/releases/download/v{{ phpfpm_exporter_version }}/php-fpm_exporter_{{ phpfpm_exporter_version }}_linux_amd64"
    dest: /usr/local/bin/php-fpm_exporter
    mode: "0755"
  when: not phpfpm_exporter_bin.stat.exists

- name: Create php-fpm_exporter systemd service
  template:
    src: php-fpm_exporter.service.j2
    dest: /etc/systemd/system/php-fpm_exporter.service
    mode: "0644"
  notify: restart php-fpm_exporter

- name: Enable and start php-fpm_exporter
  systemd:
    name: php-fpm_exporter
    state: started
    enabled: true
    daemon_reload: true
