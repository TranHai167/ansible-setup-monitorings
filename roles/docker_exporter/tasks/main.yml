---
- name: Ensure jq is installed
  apt:
    name: jq
    state: present

- name: Stop and remove cAdvisor container (replaced by textfile metrics)
  docker_container:
    name: cadvisor
    state: absent
  ignore_errors: true

- name: Stop and remove docker_exporter container (if any)
  docker_container:
    name: docker_exporter
    state: absent
  ignore_errors: true

- name: Ensure textfile collector directory exists
  file:
    path: "{{ docker_exporter_textfile_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy docker container metrics script
  template:
    src: docker-container-metrics.sh.j2
    dest: /usr/local/bin/docker-container-metrics.sh
    owner: root
    group: root
    mode: "0755"

- name: Setup cron job for docker container metrics
  cron:
    name: "docker_container_metrics"
    minute: "{{ docker_exporter_interval }}"
    job: "/usr/local/bin/docker-container-metrics.sh"
    user: root

- name: Run initial metrics collection
  command: /usr/local/bin/docker-container-metrics.sh
  changed_when: false
