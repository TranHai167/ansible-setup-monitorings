---
# Playbook: Cài Prometheus + Grafana + Alertmanager bằng Docker trên EC2 monitoring
# Usage: ansible-playbook playbooks/setup-monitoring.yml
# Không cần truyền target_ip nữa - tự lấy từ inventory target_servers
- name: Setup monitoring stack on EC2 (Docker)
  hosts: monitoring_server
  become: true
  gather_facts: true

  vars:
    monitoring_base_dir: /opt/monitoring

    # SMTP credentials
    smtp_host: "{{ lookup('env', 'SMTP_HOST') | default('smtp.office365.com', true) }}"
    smtp_port: "{{ lookup('env', 'SMTP_PORT') | default('587', true) }}"
    smtp_user: "{{ lookup('env', 'SMTP_USER') }}"
    smtp_password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
    alert_from_email: "{{ lookup('env', 'FROM_EMAIL') }}"
    alert_to_email: "{{ lookup('env', 'TO_EMAIL') }}"

  pre_tasks:
    - name: Fail if no target servers defined
      fail:
        msg: "Không có target server nào trong inventory group 'target_servers'"
      when: groups['target_servers'] | default([]) | length == 0

    # === Ubuntu/Debian ===
    - name: "[Debian] Install Docker dependencies"
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: "[Debian] Add Docker GPG key"
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc
      when: ansible_os_family == "Debian"

    - name: "[Debian] Add Docker repository"
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list
      when: ansible_os_family == "Debian"

    - name: "[Debian] Install Docker"
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: "[Debian] Install python3-docker"
      apt:
        name: [python3-pip, python3-docker]
        state: present
      when: ansible_os_family == "Debian"

    # === Amazon Linux / RHEL ===
    - name: "[RedHat] Install Docker"
      dnf:
        name: [docker]
        state: present
      when: ansible_os_family == "RedHat"

    - name: "[RedHat] Install docker-compose plugin"
      shell: |
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      args:
        creates: /usr/local/lib/docker/cli-plugins/docker-compose
      when: ansible_os_family == "RedHat"

    - name: "[RedHat] Install python3-pip and docker SDK"
      dnf:
        name: [python3-pip]
        state: present
      when: ansible_os_family == "RedHat"

    - name: "[RedHat] Install docker Python SDK"
      pip:
        name: docker
        state: present
        extra_args: --user
      when: ansible_os_family == "RedHat"

    # === Common ===
    - name: Start Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Create monitoring directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_base_dir }}"
        - "{{ monitoring_base_dir }}/prometheus"
        - "{{ monitoring_base_dir }}/alertmanager"
        - "{{ monitoring_base_dir }}/grafana"

  tasks:
    - name: Create Prometheus config (multi-target)
      template:
        src: "{{ playbook_dir }}/../templates/prometheus.yml.j2"
        dest: "{{ monitoring_base_dir }}/prometheus/prometheus.yml"
        mode: "0644"

    - name: Create Prometheus alert rules
      copy:
        dest: "{{ monitoring_base_dir }}/prometheus/alert_rules.yml"
        mode: "0644"
        content: |
          groups:
            - name: target_health
              rules:
                - alert: TargetDown
                  expr: up{job!="phpfpm"} == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "{{ '{{' }} $labels.job {{ '}}' }} on {{ '{{' }} $labels.instance_name {{ '}}' }} ({{ '{{' }} $labels.instance {{ '}}' }}) is DOWN"
                    description: "Exporter {{ '{{' }} $labels.job {{ '}}' }} trên {{ '{{' }} $labels.instance_name {{ '}}' }} không scrape được."

                - alert: PHPFPMTargetDown
                  expr: up{job="phpfpm"} == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "phpfpm on {{ '{{' }} $labels.instance_name {{ '}}' }} ({{ '{{' }} $labels.instance {{ '}}' }}) is DOWN"
                    description: "PHP-FPM exporter trên {{ '{{' }} $labels.instance_name {{ '}}' }} không scrape được."

                - alert: NodeExporterDown
                  expr: absent(up{job="node-exporter"} == 1)
                  for: 2m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Node Exporter is DOWN - không lấy được metrics hệ thống"

            - name: host_alerts
              rules:
                - alert: HighCPU
                  expr: 100 - (avg by(instance, instance_name) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "CPU > 80% on {{ '{{' }} $labels.instance_name {{ '}}' }}"
                    description: "CPU usage: {{ '{{' }} $value | printf \"%.1f\" {{ '}}' }}%"

                - alert: HighMemory
                  expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Memory > 85% on {{ '{{' }} $labels.instance_name {{ '}}' }}"
                    description: "Memory usage: {{ '{{' }} $value | printf \"%.1f\" {{ '}}' }}%"

                - alert: DiskSpaceLow
                  expr: (1 - node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes) * 100 > 85
                  for: 5m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Disk > 85% on {{ '{{' }} $labels.instance_name {{ '}}' }} ({{ '{{' }} $labels.mountpoint {{ '}}' }})"

                - alert: HighDiskIO
                  expr: rate(node_disk_io_time_seconds_total[5m]) > 0.9
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Disk I/O saturated on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: HighNetworkTraffic
                  expr: rate(node_network_receive_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m]) > 100000000
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Network receive > 100MB/s on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: SystemdServiceFailed
                  expr: node_systemd_unit_state{state="failed"} == 1
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Systemd service {{ '{{' }} $labels.name {{ '}}' }} FAILED on {{ '{{' }} $labels.instance_name {{ '}}' }}"

            - name: docker_alerts
              rules:
                - alert: ContainerNotRunning
                  expr: (time() - container_last_seen{name!="",name!~"cadvisor"}) > 120
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Container {{ '{{' }} $labels.name {{ '}}' }} not running on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: ContainerHighCPU
                  expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Container {{ '{{' }} $labels.name {{ '}}' }} CPU > 80% on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: ContainerHighMemory
                  expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100 > 85) and container_spec_memory_limit_bytes{name!=""} > 0
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Container {{ '{{' }} $labels.name {{ '}}' }} Memory > 85% on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: ContainerRestarting
                  expr: changes(container_start_time_seconds{name!=""}[10m]) > 1
                  for: 1m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Container {{ '{{' }} $labels.name {{ '}}' }} restarting frequently on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: ContainerOOMKilled
                  expr: container_oom_events_total{name!=""} > 0
                  for: 0m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Container {{ '{{' }} $labels.name {{ '}}' }} bị OOM Killed on {{ '{{' }} $labels.instance_name {{ '}}' }}"

            - name: phpfpm_alerts
              rules:
                - alert: PHPFPMDown
                  expr: phpfpm_up == 0
                  for: 30s
                  labels:
                    severity: critical
                  annotations:
                    summary: "PHP-FPM is DOWN on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: PHPFPMQueueHigh
                  expr: phpfpm_listen_queue > 10
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "PHP-FPM queue > 10 on {{ '{{' }} $labels.instance_name {{ '}}' }}"
                    description: "Queue length: {{ '{{' }} $value {{ '}}' }}"

                - alert: PHPFPMMaxChildrenReached
                  expr: rate(phpfpm_max_children_reached[5m]) > 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "PHP-FPM max children reached on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: PHPFPMSlowRequests
                  expr: rate(phpfpm_slow_requests[5m]) > 0
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "PHP-FPM có slow requests on {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: PHPFPMNoActiveProcesses
                  expr: phpfpm_active_processes == 0 and phpfpm_up == 1
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "PHP-FPM running nhưng không có active process on {{ '{{' }} $labels.instance_name {{ '}}' }}"

            - name: magento_cron_alerts
              rules:
                - alert: MagentoCronNotRunning
                  expr: (time() - magento_cron_last_scrape_timestamp) > 600
                  for: 2m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Magento cron metrics không chạy trên {{ '{{' }} $labels.instance_name {{ '}}' }}"
                    description: "Script thu thập metrics cron đã không chạy hơn 5 phút."

                - alert: MagentoCronScrapeError
                  expr: magento_cron_scrape_error == 1
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Magento cron metrics lỗi kết nối DB trên {{ '{{' }} $labels.instance_name {{ '}}' }}"

                - alert: MagentoCronHighErrors
                  expr: magento_cron_jobs_total{status="error"} > 5
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Magento cron có nhiều job error trên {{ '{{' }} $labels.instance_name {{ '}}' }}"
                    description: "Số job error trong 5 phút: {{ '{{' }} $value {{ '}}' }}"

                - alert: MagentoCronJobError
                  expr: magento_cron_error_by_job > 3
                  for: 5m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Magento cron job {{ '{{' }} $labels.job_code {{ '}}' }} lỗi nhiều trên {{ '{{' }} $labels.instance_name {{ '}}' }}"
                    description: "Số lần lỗi trong 1h: {{ '{{' }} $value {{ '}}' }}"

    - name: Create Alertmanager config
      copy:
        dest: "{{ monitoring_base_dir }}/alertmanager/alertmanager.yml"
        mode: "0644"
        content: |
          route:
            receiver: email
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            group_by: ['alertname', 'instance_name']
            routes:
              - match:
                  severity: critical
                repeat_interval: 1h
          receivers:
            - name: email
              email_configs:
                - to: {{ alert_to_email | to_json }}
                  from: {{ alert_from_email | to_json }}
                  smarthost: {{ (smtp_host ~ ':' ~ smtp_port) | to_json }}
                  auth_username: {{ smtp_user | to_json }}
                  auth_password: {{ smtp_password | to_json }}
                  auth_identity: {{ smtp_user | to_json }}
                  require_tls: true
                  send_resolved: true
                  headers:
                    Subject: '{{ "{{" }} .Status | toUpper {{ "}}" }}] {{ "{{" }} .GroupLabels.alertname {{ "}}" }} - {{ "{{" }} .GroupLabels.instance_name {{ "}}" }}'

    - name: Create Docker Compose file
      copy:
        dest: "{{ monitoring_base_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:v2.53.0
              container_name: prometheus
              restart: always
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
                - prometheus_data:/prometheus
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--storage.tsdb.retention.time=7d'
                - '--storage.tsdb.retention.size=15GB'
                - '--web.enable-lifecycle'

            grafana:
              image: grafana/grafana:11.1.0
              container_name: grafana
              restart: always
              ports:
                - "3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=admin
                - GF_USERS_ALLOW_SIGN_UP=false

            alertmanager:
              image: prom/alertmanager:v0.27.0
              container_name: alertmanager
              restart: always
              ports:
                - "9093:9093"
              volumes:
                - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

          volumes:
            prometheus_data:
            grafana_data:

    - name: Start monitoring stack
      shell: docker compose up -d
      args:
        chdir: "{{ monitoring_base_dir }}"

    - name: Wait for services to start
      pause:
        seconds: 10

    - name: Check Prometheus
      uri:
        url: http://localhost:9090/-/healthy
        return_content: false
      register: prom_check
      ignore_errors: true

    - name: Check Grafana
      uri:
        url: http://localhost:3000/api/health
        return_content: false
      register: grafana_check
      ignore_errors: true

    - name: Show access info
      debug:
        msg: |
          === Monitoring Stack Status ===
          Prometheus  (9090): {{ 'OK' if prom_check is success else 'FAILED' }}
          Grafana     (3000): {{ 'OK' if grafana_check is success else 'FAILED' }}
          Alertmanager(9093): Running

          === Monitored Targets ===
          {% for host in groups['target_servers'] %}
          - {{ host }}: {{ hostvars[host].private_ip }} (phpfpm: {{ hostvars[host].install_phpfpm_exporter | default(false) }})
          {% endfor %}

          === Grafana Setup ===
          1. Login Grafana → Add Data Source → Prometheus
          2. URL: http://prometheus:9090
          3. Import Dashboards: 1860 (Node), 14282 (Docker), 4912 (PHP-FPM)
